<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>MyReword — карточки слов</title>
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141c28"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="shine" x1="10" y1="7" x2="26" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- подложка -->
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <!-- задняя карточка -->
  <rect x="6.5" y="10" width="15" height="17" rx="3" fill="#172231" stroke="#273445" stroke-width="0.85"/>
  <!-- передняя карточка -->
  <rect x="9.5" y="6" width="15" height="17" rx="3" fill="#1a2433" stroke="#3b82f6" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- маркер «точка повторения» -->
  <circle cx="13" cy="9.5" r="2" fill="url(#shine)"/>
  <!-- линии «текста» на карточке -->
  <path
    stroke="#93a4bd"
    stroke-opacity="0.9"
    stroke-width="1.15"
    stroke-linecap="round"
    d="M16.5 9.5h8M11.5 13.5h12M11.5 16.5h9"
  />
</svg>
